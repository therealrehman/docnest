name: Android build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.27 or newer is needed (see README). Pinned so every run builds the same way.
  FLUTTER_VERSION: "3.27.4"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create android/ folder and camera permission
        run: bash tool/setup_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    # Runs on its own, so the APK is still built if a test fails.
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create android/ folder and camera permission
        run: bash tool/setup_android.sh

      # Gradle needs Java 17. This runs after android/ exists so the
      # Gradle cache key is built from the real Gradle files.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Get packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      # flutter build apk runs Gradle (assembleDebug / assembleRelease) inside android/.
      - name: Build debug APK (Gradle assembleDebug)
        run: flutter build apk --debug

      - name: Build release APK (Gradle assembleRelease)
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: docnest-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
